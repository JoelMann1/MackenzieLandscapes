<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Performance Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #0a0a0a;
      color: #fff;
    }
    h1 { color: #7B8B47; }
    .test-section {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      margin: 5px 0;
      background: #0f0f0f;
      border-radius: 4px;
    }
    .metric-label { font-weight: 600; }
    .metric-value { 
      font-family: 'Courier New', monospace;
      color: #7B8B47;
    }
    .good { color: #4ade80 !important; }
    .warning { color: #fbbf24 !important; }
    .bad { color: #ff6b6b !important; }
    button {
      background: #596B3A;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover { background: #46562D; }
    #console-output {
      background: #000;
      color: #0f0;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .log-line { margin: 2px 0; }
    iframe {
      width: 100%;
      height: 600px;
      border: 2px solid #333;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🚀 Gallery Performance Test Suite</h1>
  
  <div class="test-section">
    <h2>📊 Performance Metrics</h2>
    <div id="metrics">
      <div class="metric">
        <span class="metric-label">Status:</span>
        <span class="metric-value" id="status">Ready to test</span>
      </div>
    </div>
    <button onclick="runTests()">▶️ Run All Tests</button>
    <button onclick="loadGallery()">🖼️ Load Gallery in Frame</button>
    <button onclick="clearConsole()">🗑️ Clear Console</button>
  </div>

  <div class="test-section">
    <h2>📝 Test Console</h2>
    <div id="console-output"></div>
  </div>

  <div class="test-section">
    <h2>🖼️ Gallery Preview</h2>
    <iframe id="gallery-frame" style="display:none;"></iframe>
  </div>

  <script>
    const consoleOutput = document.getElementById('console-output');
    const metricsDiv = document.getElementById('metrics');
    
    function log(message, type = 'info') {
      const line = document.createElement('div');
      line.className = 'log-line';
      const timestamp = new Date().toLocaleTimeString();
      line.textContent = `[${timestamp}] ${message}`;
      consoleOutput.appendChild(line);
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function clearConsole() {
      consoleOutput.innerHTML = '';
    }

    function addMetric(label, value, status = 'good') {
      const metric = document.createElement('div');
      metric.className = 'metric';
      metric.innerHTML = `
        <span class="metric-label">${label}:</span>
        <span class="metric-value ${status}">${value}</span>
      `;
      metricsDiv.appendChild(metric);
    }

    function loadGallery() {
      const iframe = document.getElementById('gallery-frame');
      iframe.style.display = 'block';
      iframe.src = 'gallery.html';
      log('✅ Gallery loaded in iframe');
    }

    async function runTests() {
      clearConsole();
      metricsDiv.innerHTML = '<div class="metric"><span class="metric-label">Status:</span><span class="metric-value">Running tests...</span></div>';
      
      log('🚀 Starting comprehensive performance tests...');
      
      // Test 1: Count images in gallery
      log('📸 Test 1: Counting gallery images...');
      const response = await fetch('gallery.html');
      const html = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const images = doc.querySelectorAll('.gallery-grid img');
      const imageCount = images.length;
      log(`✅ Found ${imageCount} images in gallery`);
      addMetric('Total Images', imageCount, imageCount <= 40 ? 'good' : 'warning');
      
      // Test 2: Check for Lenis
      const hasLenis = html.includes('lenis.min.js');
      log(`📦 Test 2: Checking for Lenis library...`);
      log(hasLenis ? '❌ Lenis is still loaded (should be removed)' : '✅ Lenis removed from gallery page');
      addMetric('Lenis Library', hasLenis ? 'Loaded ❌' : 'Removed ✅', hasLenis ? 'bad' : 'good');
      
      // Test 3: Check lazy loading attributes
      log('⚡ Test 3: Checking lazy loading attributes...');
      let lazyCount = 0;
      images.forEach(img => {
        if(img.getAttribute('loading') === 'lazy') lazyCount++;
      });
      log(`✅ ${lazyCount}/${imageCount} images have loading="lazy"`);
      addMetric('Lazy Loading', `${lazyCount}/${imageCount}`, lazyCount === imageCount ? 'good' : 'warning');
      
      // Test 4: Measure page size
      log('📦 Test 4: Measuring page size...');
      const pageSize = (html.length / 1024).toFixed(2);
      log(`✅ Gallery HTML size: ${pageSize} KB`);
      addMetric('HTML Size', `${pageSize} KB`, pageSize < 50 ? 'good' : 'warning');
      
      log('✅ All tests complete!');
      document.getElementById('status').textContent = 'Tests complete ✅';
      document.getElementById('status').className = 'metric-value good';
    }
  </script>
</body>
</html>
